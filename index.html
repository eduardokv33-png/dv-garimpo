<style>
*{

body{

header{

</head>
<body>

<header>
  <div class="banner-info">
    <div>✨ Novidades toda semana</div>
    <div>📦 Enviamos para todo o Brasil</div>
    <div>💬 Atendimento rápido via WhatsApp</div>
</div>
<img src="logo.jpg" class="logo">
<h1>DV GARIMPO</h1>
<p class="sub">Peças selecionadas e curadoria especial</p>
</header>

<div class="banner-info">
    <div>✨ Novidades toda semana</div>
    <div>📦 Enviamos para todo o Brasil</div>
    <div>💬 Atendimento rápido via WhatsApp</div>
</div>

<div class="topo">

<input
type="text"
class="busca"
placeholder="Pesquisar produto..."
id="busca">

<div class="filtros">
<button onclick="filtrar('Todos')">Todos</button>
<button onclick="filtrar('Feminino')">Feminino</button>
<button onclick="filtrar('Masculino')">Masculino</button>
</div>

<div class="contador" id="contador"></div>

</div>

<div class="grid" id="produtos"></div>

<script>

let todosProdutos = [];
let categoriaAtual = "Todos";

fetch('produtos.json')
.then(r=>r.json())
.then(produtos=>{
todosProdutos = produtos;
renderizar(produtos);
});

function renderizar(lista){

const area = document.getElementById('produtos');
const contador = document.getElementById('contador');

contador.innerText =
lista.length + " produto(s) encontrado(s)";

area.innerHTML = '';

lista.forEach(produto=>{

area.innerHTML += `
<div class="card" style="position:relative;">

${produto.vendido ? `
<div style="
position:absolute;
top:15px;
right:15px;
background:red;
color:white;
padding:8px 12px;
border-radius:8px;
font-weight:bold;
z-index:2;
">
VENDIDO
</div>
` : ''}

<img src="${produto.imagem}">

<div class="info">

<h3>${produto.nome}</h3>

<p style="
display:inline-block;
background:#d4af37;
color:black;
padding:4px 10px;
border-radius:20px;
font-weight:bold;
margin-bottom:10px;
">
${produto.categoria}
</p>

<p><strong>Tamanho:</strong> ${produto.tamanho}</p>

<div class="preco">${produto.preco}</div>

<div class="botoes">

<a class="btn eduardo"
href="https://wa.me/5511997111518?text=Olá! Tenho interesse em ${encodeURIComponent(produto.nome)}"
target="_blank">
Comprar com Eduardo
</a>

<a class="btn virginia"
href="https://wa.me/5511964384557?text=Olá! Tenho interesse em ${encodeURIComponent(produto.nome)}"
target="_blank">
Comprar com Virgínia
</a>

</div>

</div>

</div>
`;
});

}

function filtrar(cat){

categoriaAtual = cat;

if(cat === "Todos"){
renderizar(todosProdutos);
return;
}

const filtrados =
todosProdutos.filter(
p => p.categoria === cat
);

renderizar(filtrados);
}

document
.getElementById('busca')
.addEventListener('input', function(){

const termo =
this.value.toLowerCase();

let lista = todosProdutos;

if(categoriaAtual !== "Todos"){
lista =
lista.filter(
p=>p.categoria===categoriaAtual
);
}

lista =
lista.filter(
p=>p.nome.toLowerCase().includes(termo)
);

renderizar(lista);

});

</script>
<!-- Modal da imagem -->
<div id="modalImagem" class="modal">
  <span class="fechar">&times;</span>
  <img class="modal-conteudo" id="imgExpandida">
</div>

<style>
.modal{
  display:none;
  position:fixed;
  z-index:9999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.95);
}

.modal-conteudo{
  display:block;
  margin:auto;
  max-width:90%;
  max-height:90%;
  margin-top:30px;
}

.fechar{
  position:absolute;
  top:20px;
  right:35px;
  color:white;
  font-size:40px;
  cursor:pointer;
}
  .banner-info{
    background:#111;
    border-top:1px solid rgba(212,175,55,.3);
    border-bottom:1px solid rgba(212,175,55,.3);
    padding:15px;
    text-align:center;
    color:#d4af37;
    font-weight:bold;
    display:flex;
    justify-content:center;
    gap:30px;
    flex-wrap:wrap;
}

</style>

<script>
document.addEventListener("click", function(e){

  if(e.target.tagName === "IMG" &&
     e.target.closest(".card")){

      document.getElementById("modalImagem").style.display="block";
      document.getElementById("imgExpandida").src=e.target.src;
  }

});

document.querySelector(".fechar").onclick = function(){
  document.getElementById("modalImagem").style.display="none";
}

document.getElementById("modalImagem").onclick = function(e){
  if(e.target.id === "modalImagem"){
      this.style.display="none";
  }
}
</script>
</body>
</html>
