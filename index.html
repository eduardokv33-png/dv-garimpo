<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DV GARIMPO</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#000;
color:white;
}

header{
text-align:center;
padding:30px;
}

header img{
width:180px;
border-radius:10px;
}

header h1{
margin-top:15px;
color:#d4af37;
}

.contato{
margin-top:10px;
}

.contato a{
display:inline-block;
margin:5px;
padding:10px 20px;
background:#d4af37;
color:black;
text-decoration:none;
border-radius:8px;
font-weight:bold;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
padding:20px;
}

.card{
background:#111;
border-radius:12px;
overflow:hidden;
box-shadow:0 0 10px rgba(212,175,55,.3);
}

.card img{
width:100%;
height:320px;
object-fit:cover;
}

.info{
padding:15px;
}

.info h3{
color:#d4af37;
margin-bottom:8px;
}

.info p{
margin:4px 0;
}

</style>
</head>
<body>

<header>

<img src="logo.jpg">

<h1>DV GARIMPO</h1>

<div class="contato">
<a href="https://wa.me/5511997111518">
Falar com Eduardo
</a>
</div>

</header>

<div class="grid" id="produtos"></div>

<script>

fetch('produtos.json')
.then(res => res.json())
.then(produtos => {

const area = document.getElementById('produtos');

produtos.forEach(produto => {

area.innerHTML += `

<div class="card">

<img src="${produto.imagem}">

<div class="info">

<h3>${produto.nome}</h3>

<p><strong>Tamanho:</strong> ${produto.tamanho}</p>

<p><strong>Categoria:</strong> ${produto.categoria}</p>

<p><strong>Preço:</strong> ${produto.preco}</p>

</div>

</div>

`;

});

});

</script>

</body>
</html>
